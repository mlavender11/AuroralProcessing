# Preview:  aurora pipeline run jobs/example_bin_sweep.yaml --dry-run
# Paths are relative to this file's folder.
output: ../optical_flow/processed
sources:
  - ../optical_flow/data/2013-03-27-CamSer7196_015400-015600.h5
